name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cghq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cghq_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages and apps
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & contract tests
        run: pnpm test

      - name: Run PostgreSQL migrations on clean DB
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cghq_test
        run: |
          pnpm db:migrate
          pnpm db:migrate
